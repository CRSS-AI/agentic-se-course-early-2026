name: Sync fork and deploy

# Keeps the live Pages site in step with the upstream fork.
#
# This workflow only syncs. The build and deploy live in deploy.yml, which
# comes from upstream, so the fork always builds the site the way upstream
# does. An earlier version copied the build steps here; when upstream moved
# the site to site/ and the old app under /v1/, that copy kept deploying the
# stale app every night while reporting success.
#
# Why dispatch deploy.yml instead of relying on its `on: push`? A branch
# update made with GITHUB_TOKEN cannot trigger another workflow's push event
# (GitHub's anti-recursion rule), but workflow_dispatch is exempt from it.
#
# Token: GITHUB_TOKEN can never be granted the `workflows` permission, so
# merge-upstream is refused (HTTP 422) whenever an upstream commit touches
# .github/workflows/. Add a FORK_SYNC_TOKEN repository secret (a fine-grained
# token on this repository with Contents and Workflows read/write) and the
# sync handles those commits too. Without it, such a run fails, and the fix is
# a manual "Sync fork" on GitHub, which does fire deploy.yml's push trigger.

on:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write # merge-upstream updates main; mirrored tags are pushed
  actions: write # resets this workflow's inactivity counter, dispatches deploy.yml

concurrency:
  group: fork-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN || github.token }}
    steps:
      # GitHub disables scheduled workflows after 60 days with no repository
      # activity, and scheduled runs that produce no commit do not count as
      # activity. That is exactly how this workflow died: the last fork commit
      # was 2026-06-11, and the schedule stopped firing on 2026-08-11, leaving
      # the live site serving stale content until someone noticed by hand.
      #
      # Force-enabling the workflow resets that counter, so the 60 day clock
      # never runs out while runs keep happening. This step is deliberately
      # first, so a failure further down the job can never skip it, and it has
      # no "|| true": if the token cannot do this, the run must fail loudly
      # rather than let the site drift stale again in silence.
      - name: Reset the scheduled workflow inactivity counter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT \
            "repos/${{ github.repository }}/actions/workflows/sync-and-deploy.yml/enable"

      # No "|| echo" here: a refused or conflicting merge fails the run, so a
      # stuck fork shows up red instead of green. The steps below still run,
      # so tags and the live site stay current with whatever main holds.
      - name: Sync main from upstream
        run: |
          gh api -X POST "repos/${{ github.repository }}/merge-upstream" \
            -f branch=main \
            --jq '"merge_type=\(.merge_type): \(.message)"'

      - name: Check out main
        if: ${{ !cancelled() }}
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.FORK_SYNC_TOKEN || github.token }}

      # merge-upstream syncs branches only. deploy.yml checks out tags (the
      # archived v1 site is rebuilt from v1.0), so copy over any upstream tag
      # the fork lacks. Tags the fork already has are left alone.
      - name: Mirror new upstream tags
        if: ${{ !cancelled() }}
        run: |
          upstream_url="https://github.com/$(gh api "repos/${{ github.repository }}" --jq .parent.full_name).git"
          missing=$(comm -13 \
            <(git ls-remote --tags --refs origin | awk '{print $2}' | sort) \
            <(git ls-remote --tags --refs "$upstream_url" | awk '{print $2}' | sort))
          if [ -z "$missing" ]; then
            echo "The fork already has every upstream tag."
            exit 0
          fi
          echo "Mirroring:" $missing
          git fetch --no-tags "$upstream_url" $(for ref in $missing; do printf '%s:%s ' "$ref" "$ref"; done)
          git push origin $missing

      # With FORK_SYNC_TOKEN, a merge also fires deploy.yml's push trigger; the
      # pages concurrency group cancels the older of the two runs.
      - name: Deploy main
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml -R "${{ github.repository }}" --ref main
