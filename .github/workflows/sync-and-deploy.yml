name: Sync fork and deploy

# Keeps the live Pages site in step with the upstream fork.
#
# Why a dedicated workflow instead of relying on deploy.yml's `on: push`?
# Syncing a fork (the web "Sync fork" button, `gh repo sync`, or the
# merge-upstream API) does NOT emit a push event that triggers `on: push`
# workflows, and a branch update made here with GITHUB_TOKEN cannot trigger
# another workflow (GitHub's anti-recursion rule). So this workflow does the
# whole job itself: pull upstream into main, then build and deploy.

on:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write # merge-upstream updates the main branch
  actions: write # force-enabling this workflow resets its inactivity counter
  pages: write
  id-token: write

# Share the deploy lane with deploy.yml so the two never deploy at once.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync-build:
    runs-on: ubuntu-latest
    steps:
      # GitHub disables scheduled workflows after 60 days with no repository
      # activity, and scheduled runs that produce no commit do not count as
      # activity. That is exactly how this workflow died: the last fork commit
      # was 2026-06-11, and the schedule stopped firing on 2026-08-11, leaving
      # the live site serving stale content until someone noticed by hand.
      #
      # Force-enabling the workflow resets that counter, so the 60 day clock
      # never runs out while runs keep happening. This step is deliberately
      # first, so a failure further down the job can never skip it, and it has
      # no "|| true": if the token cannot do this, the run must fail loudly
      # rather than let the site drift stale again in silence.
      - name: Reset the scheduled workflow inactivity counter
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PUT \
            "repos/${{ github.repository }}/actions/workflows/sync-and-deploy.yml/enable"

      - name: Sync main from upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Merging upstream into main via the fork merge-upstream API..."
          gh api -X POST "repos/${{ github.repository }}/merge-upstream" \
            -f branch=main \
            || echo "merge-upstream returned non-zero (already up to date, or main has diverged and needs a manual sync) — continuing to rebuild current main."

      - name: Check out the freshly synced main
        uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: sync-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
